
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Tech Hub Login</title>

<style>
body{
font-family:Arial,sans-serif;
background:#2563eb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.login-box{
background:white;
padding:30px;
border-radius:12px;
width:320px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
font-size:18px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#msg{
margin-top:15px;
text-align:center;
font-weight:bold;
}
</style>
</head>

<body>

<div class="login-box">

<h2>🎓 Student Login</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">

Login

</button>

<p id="msg"></p>

</div>

<script>

function login(){

let user=document.getElementById("username").value;

let pass=document.getElementById("password").value;

if(user==="admin" && pass==="1234"){

document.getElementById("msg").innerHTML="✅ Login Successful";

setTimeout(()=>{
window.location="dashboard.html";
},1000);

}else{

document.getElementById("msg").innerHTML="❌ Invalid Username or Password";

}

}

</script>

</body>
</html>
